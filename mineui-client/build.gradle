plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

base {
    archivesName = 'mineui-client'
}

loom {
    splitEnvironmentSourceSets()


    mods {
        "mineui" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // 纯 Java 协议模块：编译期依赖，构建时直接内嵌进 mod jar
    compileOnly project(':mineui-protocol')
    compileOnly 'com.google.code.gson:gson:2.10.1'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

jar {
    // 26.x 起 Minecraft 官方不再混淆，Loom 使用 no-remap 模式，jar 即最终产物
    from { project(':mineui-protocol').sourceSets.main.output }
    dependsOn ':mineui-protocol:classes'
}
