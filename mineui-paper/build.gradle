plugins {
    id 'java'
    id 'maven-publish'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paper_version}"
    // Gson 由 Paper 运行时提供
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly project(':mineui-protocol')

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    archiveBaseName = 'MineUI'
    // 把纯 Java 协议模块内嵌进插件 jar（不引入额外依赖）
    from { project(':mineui-protocol').sourceSets.main.output }
    dependsOn ':mineui-protocol:classes'
}

// 供业务插件（compileOnly）依赖：./gradlew :mineui-paper:publishToMavenLocal
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
